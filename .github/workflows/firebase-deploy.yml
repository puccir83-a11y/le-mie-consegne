
name: Promemoria consegne

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Autenticazione Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-firebase-deploy@le-mie-consegne.iam.gserviceaccount.com
          token_format: access_token

      - name: Installa dipendenze
        run: npm install --no-save firebase-admin@13

      - name: Invia promemoria
        env:
          GOOGLE_CLOUD_PROJECT: le-mie-consegne
        run: node scripts/send-reminders.cjs
