
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie consegne</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f8;color:#202938;margin:0;padding:16px}
header{background:#176b55;color:white;padding:20px;border-radius:14px}
h1{font-size:25px;margin:0 0 8px}
section{background:white;padding:16px;margin-top:14px;border-radius:12px}
input,select,button{font:inherit;padding:11px;margin:5px 0;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #ccd2da}
button{background:#176b55;color:white;border:0;font-weight:bold}
.secondary{background:#e7efec;color:#176b55}
label{display:block;margin:8px 0}
.days{display:grid;grid-template-columns:1fr 1fr}
.client{border-top:1px solid #ddd;padding:12px 0}
.small{font-size:13px;color:#606977}
</style>
</head>
<body>
<header>
<h1>Le mie consegne</h1>
Promemoria e gestione clienti
</header>

<section>
<h2>Promemoria di oggi</h2>
<p id="today">Controllo dei promemoria in base ai giorni di consegna.</p>
<div id="reminders"></div>
</section>

<section>
<h2>Nuovo cliente</h2>
<form id="form">
<input id="name" placeholder="Nome o ragione sociale" required>
<input id="shop" placeholder="Nome insegna">
<input id="phone" placeholder="Telefono">
<input id="city" placeholder="Città / paese / frazione">
<input id="address" placeholder="Indirizzo">
<input id="group" placeholder="Nome del gruppo WhatsApp">

<p><b>Giorni di consegna</b></p>
<div class="days">
<label><input type="checkbox" name="day" value="1"> Lunedì</label>
<label><input type="checkbox" name="day" value="2"> Martedì</label>
<label><input type="checkbox" name="day" value="3"> Mercoledì</label>
<label><input type="checkbox" name="day" value="4"> Giovedì</label>
<label><input type="checkbox" name="day" value="5"> Venerdì</label>
<label><input type="checkbox" name="day" value="6"> Sabato</label>
<label><input type="checkbox" name="day" value="0"> Domenica</label>
</div>
<label>Cliente stagionale?</label>
<select id="season">
<option value="">No</option>
<option value="yes">Sì</option>
</select>
<label>Data di riapertura (se stagionale)</label>
<input type="date" id="reopen">
<button type="submit">Salva cliente</button>
</form>
</section>

<section>
<h2>Tutti i clienti</h2>
<input id="search" placeholder="Cerca cliente o località">
<div id="clients"></div>
</section>

<script>
const names=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
let clients=[];
try{clients=JSON.parse(localStorage.getItem("mieConsegne")||"[]")}catch(e){}
function save(){localStorage.setItem("mieConsegne",JSON.stringify(clients));render()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const q=(document.getElementById("search").value||"").toLowerCase();
 document.getElementById("clients").innerHTML=clients.map((c,i)=>({...c,i})).filter(c=>(c.name+" "+c.city).toLowerCase().includes(q)).map(c=>
 `<div class="client"><b>${esc(c.name)}</b><br>${esc(c.shop)}<br>${esc(c.city)} ${esc(c.address)}
 <p class="small">Consegne: ${c.days.map(d=>names[d]).join(", ")||"nessun giorno selezionato"}<br>Gruppo: ${esc(c.group)||"non indicato"}<br>Telefono: ${esc(c.phone)}</p>
 <button class="secondary" onclick="message(${c.i})">Prepara promemoria WhatsApp</button>
 <button class="secondary" onclick="removeClient(${c.i})">Elimina cliente</button></div>`).join("")||"<p>Nessun cliente salvato.</p>";
 const today=new Date().getDay();
 const due=clients.filter(c=>c.days.includes((today+1)%7));
 document.getElementById("today").textContent="Promemoria per le consegne di domani ("+names[(today+1)%7]+").";
 document.getElementById("reminders").innerHTML=due.map(c=>`<p>• ${esc(c.name)} — ${esc(c.city)}</p>`).join("")||"<p>Nessun promemoria per domani.</p>";
}
document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 const days=[...document.querySelectorAll('input[name="day"]:checked')].map(x=>Number(x.value));
 if(!days.length){alert("Seleziona almeno un giorno di consegna.");return}
 clients.push({name:name.value,shop:shop.value,phone:phone.value,city:city.value,address:address.value,group:group.value,days,season:season.value,reopen:reopen.value});
 save();e.target.reset();alert("Cliente salvato sul dispositivo.");
});
function removeClient(i){if(confirm("Vuoi eliminare questo cliente?")){clients.splice(i,1);save()}}
function message(i){
 const c=clients[i];
 const txt="Ciao! 😊 Domani passiamo per le consegne nella tua zona. Se hai bisogno di qualcosa, fammi sapere. Grazie!";
 if(confirm("Promemoria per "+c.name+". Il messaggio sarà preparato in WhatsApp. Dovrai scegliere il gruppo corretto e inviarlo manualmente.")){
 location.href="https://wa.me/?text="+encodeURIComponent(txt);
 }
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
